# One source, one wrong password, many accounts (spraying-like).
id: password_spray
category: attack_chain
seed: 31
actors:
  - {at: 0,  type: login, name: spray_alice, username: alice, client_ip: 127.0.0.30, count: 2, interval: 20, password: wrong}
  - {at: 5,  type: login, name: spray_bob,   username: bob,   client_ip: 127.0.0.30, count: 2, interval: 20, password: wrong}
  - {at: 10, type: login, name: spray_carol, username: carol, client_ip: 127.0.0.30, count: 2, interval: 20, password: wrong}
  - {at: 15, type: login, name: spray_dave,  username: dave,  client_ip: 127.0.0.30, count: 2, interval: 20, password: wrong}
ground_truth:
  findings:
    - {detector: A2, target: "auth:spray_alice", severity: medium}
    - {detector: A2, target: "auth:spray_bob", severity: medium}
    - {detector: A2, target: "auth:spray_carol", severity: medium}
    - {detector: A2, target: "auth:spray_dave", severity: medium}
  expect_incidents: 1
  note: "each account has only 2 failures, so A1 must NOT fire; the signal is one source across many accounts"
